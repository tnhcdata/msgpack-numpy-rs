[package]
name = "msgpack-numpy"
version = "0.1.5"
edition = "2024"
authors = ["Terence Liu <terence@tnhcdata.io>"]
description = "A Rust implementation of msgpack-numpy for de-/serializing NumPy scalars and arrays that matches the Python implementation"
license = "MIT"
homepage = "https://github.com/tnhcdata/msgpack-numpy-rs"
repository = "https://github.com/tnhcdata/msgpack-numpy-rs"
readme = "README.md"
keywords = ["msgpack", "numpy", "serde", "serialization", "ndarray"]
categories = ["encoding", "science"]

[dependencies]
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
thiserror = "2"
half = { version = "2", features = ["bytemuck", "num-traits"] }
num-traits = "0.2"
ndarray = ">=0.15, <0.18"
serde = "1"
serde_bytes = "0.11"

[dev-dependencies]
ctor = "1"
rmp-serde = "1.3"
rstest = "0.27"

[[example]]
name = "test_helpers_serialize"
path = "tests/helpers/serialize.rs"
doc = false

[[bench]]
name = "bench_serialize_and_deserialize"
path = "benches/bench_serialize_and_deserialize.rs"
harness = false
